<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Little Rascal · 原声试听</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f7f4e8;color:#6c573b;font:16px/1.65 system-ui,sans-serif}
    main{max-width:960px;margin:36px auto;padding:0 22px}
    h1{font-size:30px;line-height:1.2;margin:0 0 16px}h2{font-size:21px;margin:28px 0 14px}
    p{margin:10px 0 22px}.muted{color:#7e8064;font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card,.selection{background:#fffaf0;border:1px solid #dbcda9;border-radius:20px;padding:22px}
    .card h3{margin:0;font-size:24px}.time{font-size:14px;color:#81846d;margin:5px 0 14px}
    audio{display:none}
    button,a.button{display:inline-block;border:1px solid #b89455;border-radius:24px;padding:9px 15px;background:#f2dca6;color:#665032;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
    .listen{display:block;width:100%;margin-bottom:16px;background:#ecebdc;border-color:#c9c9af}
    button[aria-pressed=true]{background:#d9e2c7;border-color:#818a69}
    button:focus-visible,a:focus-visible{outline:3px solid #9aab80;outline-offset:3px}
    .choices{display:flex;flex-wrap:wrap;gap:10px}
    .selection{margin:22px 0 16px;box-shadow:0 4px 14px #6c573b10}.selection p{margin:0 0 14px}
    #status{min-height:1.7em;margin:12px 0 0;font-size:14px}
    footer{font-size:14px;color:#81846d;margin:28px 0 35px}
    @media(max-width:600px){main{margin-top:24px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>选一选球球的声音</h1>
  <p>新增 E–P 共 12 段，保留更完整的连声片段；之前的 A–D 也在。所有声音都来自你上传的音频，保持原来的音调和速度。</p>
  <p>已选定：C 是摸摸叫声，B 是生气声，D 是踢中玩具球的叫声，L 是闲时哼哼。你也可以在这里继续对比其他片段。</p>
  <p class="muted">正式游戏使用这组声音。这里的选择仅影响试听版；扬声器只开关背景音乐，球球的叫声会保留。</p>
  <section class="selection" aria-label="当前选择">
    <p id="selected" aria-live="polite"></p>
    <div class="choices">
      <a class="button" id="try-game" target="_blank" rel="noopener">在游戏里试听这组声音</a>
      <a class="button" href="../?v=audible-voices-2" target="_blank" rel="noopener">玩正式版</a>
      <a class="button" href="cry-review.html?v=cry-candidates-1">试听新增哭声候选</a>
      <button id="copy" type="button">复制选择，发回聊天</button>
      <button id="clear-idle" type="button">清除哼哼选择</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <div id="clips" aria-busy="true">
    <h2>新增片段 E–P</h2>
    <div class="grid" id="new-clips"></div>
    <h2>之前的片段 A–D</h2>
    <div class="grid" id="previous-clips"></div>
  </div>
  <footer>游戏试玩仍有点蛋、起名流程。进入游戏闲着等一会儿，球球会偶尔自己哼哼；接受摸摸、生气和踢中球时播放对应叫声。扬声器只控制背景音乐。</footer>
</main>
<script src="voice-review.js?v=approved-voice-bank-3"></script>
</body>
</html>
